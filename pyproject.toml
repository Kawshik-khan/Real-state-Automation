[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-engagement-platform"
version = "0.1.0"
description = "Backend foundation for the AI Real Estate Customer Engagement Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.0.0",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "psycopg2-binary>=2.9.12",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "openai>=1.3.5",
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=1.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "pypdf>=5.0.0",
    "requests>=2.31.0",
    "pinecone>=5.0.0",
    "psutil>=5.9.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.1,<5.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "email-validator>=2.1.0,<3.0",
    "httpx>=0.27.0,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.4,<1",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pyright]
include = ["backend"]
extraPaths = ["backend"]
pythonVersion = "3.11"

