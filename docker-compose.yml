# ──────────────────────────────────────────────
#  GLG Assets — Social AI OS (Production Stack)
#  Frontend + FastAPI Backend + Platform API + Database
# ──────────────────────────────────────────────

services:

  # ── React Frontend (Vite + Nginx SPA Server) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glg-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - glg-net

  # ── FastAPI Backend (Workstreams 01-33) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glg-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-glg_assets}
      - AUTOMATION_SHARED_SECRET=${AUTOMATION_SHARED_SECRET:-glg-secret-key}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - glg-net

  # ── Sales engine worker: agent turns, visit reminders, follow-ups, alerts, daily digest ──
  sales-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glg-sales-worker
    entrypoint: ["sh", "-c", "python -m app.worker --setup && exec python -m app.worker"]
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-glg_assets}
      - AUTOMATION_SHARED_SECRET=${AUTOMATION_SHARED_SECRET:-glg-secret-key}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - glg-net

  # ── Platform API (Workstreams 34-45) ──
  platform-api:
    build:
      context: ./platform-api
      dockerfile: Dockerfile
    container_name: glg-platform-api
    ports:
      - "8001:8000"
    env_file:
      - ./platform-api/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-glg_assets}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - glg-net

  # ── PostgreSQL with pgvector ──
  db:
    image: pgvector/pgvector:pg16
    container_name: glg-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-glg_assets}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - glg-net

networks:
  glg-net:
    driver: bridge

volumes:
  pgdata:
