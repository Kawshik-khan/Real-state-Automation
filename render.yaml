services:
  # ── FastAPI Backend Service ──
  - type: web
    name: glg-realestate-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -e ".[test]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: GLG Assets Automation API
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://fdjzbtkypedzlkwpzzzt.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AUTOMATION_SHARED_SECRET
        sync: false
      - key: DEFAULT_TENANT_ID
        value: glg-assets-main
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1

  # ── React Frontend Static Site ──
  - type: web
    name: glg-realestate-frontend
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
