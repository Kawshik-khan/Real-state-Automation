services:
  # ── FastAPI Backend Service ──
  - type: web
    name: glg-realestate-backend
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: GLG Assets Automation API
      - key: DEBUG
        value: "false"
      - key: PYTHONWARNINGS
        value: "ignore::DeprecationWarning"
      # Explicit dashboard origin: required for cookie-based session refresh.
      - key: CORS_ORIGINS
        value: "https://glg-realestate-frontend.onrender.com"
      # Frontend and API are different sites (onrender.com is a public suffix), so the
      # refresh cookie must be SameSite=None (sent cross-site, Secure). Browsers that block
      # third-party cookies (Safari) will require a fresh login after reload; serving the
      # dashboard and API from one origin removes that limitation (then use "lax").
      - key: REFRESH_COOKIE_SAMESITE
        value: "none"
      # Client IP resolution behind Render's proxy. VERIFY after deploy with
      # GET /api/v1/auth/client-ip-diagnostics (admin): resolved_client_ip must be your
      # real public IP, otherwise login rate limits are shared by all users.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Independent random value (openssl rand -hex 32); must differ from the automation secret.
      - key: JWT_SECRET
        sync: false
      # Shared revocation / lockout / rate-limit state across instances (recommended).
      - key: REDIS_URL
        sync: false
      # Webhook authenticity (endpoints fail closed until these are set).
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://fdjzbtkypedzlkwpzzzt.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AUTOMATION_SHARED_SECRET
        sync: false
      - key: DEFAULT_TENANT_ID
        value: glg-assets-main
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-large
      - key: WHISPER_MODEL
        value: whisper-large-v3
      - key: VISION_MODEL
        value: llama-3.2-11b-vision-preview
      - key: VECTOR_DIM
        value: "1024"
      - key: VECTOR_STORE_PROVIDER
        value: pinecone
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: real-state-automation
      - key: PINECONE_HOST
        value: https://real-state-automation-o25ptb6.svc.aped-4627-b74a.pinecone.io
      - key: N8N_API_URL
        value: https://glg-ai.app.n8n.cloud/api/v1
      - key: N8N_EMAIL_WEBHOOK_URL
        value: https://glg-ai.app.n8n.cloud/webhook/glg-email-webhook
      - key: N8N_WEBHOOK_BASE_URL
        value: https://glg-ai.app.n8n.cloud
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: glg-assets-ai-os

  # ── React Frontend Static Site ──
  - type: web
    name: glg-realestate-frontend
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://glg-realestate-backend.onrender.com
      # No service secret in the frontend: the dashboard authenticates with the user's JWT.
