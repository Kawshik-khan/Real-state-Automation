services:
  # ── FastAPI Backend Service ──
  - type: web
    name: glg-realestate-backend
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -W ignore -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: GLG Assets Automation API
      - key: DEBUG
        value: "false"
      - key: PYTHONWARNINGS
        value: "ignore"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://fdjzbtkypedzlkwpzzzt.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AUTOMATION_SHARED_SECRET
        sync: false
      - key: DEFAULT_TENANT_ID
        value: glg-assets-main
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-large
      - key: WHISPER_MODEL
        value: whisper-large-v3
      - key: VISION_MODEL
        value: llama-3.2-11b-vision-preview
      - key: VECTOR_DIM
        value: "1024"
      - key: VECTOR_STORE_PROVIDER
        value: pinecone
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: real-state-automation
      - key: PINECONE_HOST
        value: https://real-state-automation-o25ptb6.svc.aped-4627-b74a.pinecone.io
      - key: N8N_API_URL
        value: https://glg-ai.app.n8n.cloud/api/v1
      - key: N8N_EMAIL_WEBHOOK_URL
        value: https://glg-ai.app.n8n.cloud/webhook/glg-email-webhook
      - key: N8N_WEBHOOK_BASE_URL
        value: https://glg-ai.app.n8n.cloud
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: glg-assets-ai-os
      # Ad platform reporting (read-only). Leave unset for platforms you do not use;
      # credentials can also be saved from Developer Console → Service Integrations.
      - key: META_ADS_ACCESS_TOKEN
        sync: false
      - key: META_AD_ACCOUNT_IDS
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      - key: GOOGLE_ADS_CUSTOMER_IDS
        sync: false
      - key: TIKTOK_ADS_ACCESS_TOKEN
        sync: false
      - key: TIKTOK_ADVERTISER_IDS
        sync: false
      - key: FX_RATES_TO_BDT
        sync: false

  # ── React Frontend Static Site ──
  - type: web
    name: glg-realestate-frontend
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://glg-realestate-backend.onrender.com
